const SAVE_KEY = "pixelcity.save.v2";
function u8ToB64(arr){
  let s = "";
  for(let i=0;i<arr.length;i+=8192) s += String.fromCharCode.apply(null, arr.subarray(i,i+8192));
  return btoa(s);
}
function b64ToU8(str){
  const bin = atob(str), out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function serialize(){
  const rad = new Uint8Array(N);
  for(let i=0;i<N;i++) rad[i] = Math.round(map.radiation[i]*255);
  return {
    v: 2, seed: game.seed,
    type: u8ToB64(map.type), density: u8ToB64(map.density), variant: u8ToB64(map.variant),
    park: u8ToB64(map.park), onFire: u8ToB64(map.onFire), rad: u8ToB64(rad),
    roadTier: u8ToB64(map.roadTier), subway: u8ToB64(map.subway),
    age: u8ToB64(new Uint8Array(map.age.buffer.slice(0))),
    blds: game.buildings.map(r => [r.x, r.y, r.b]),
    g: { money:game.money, ticks:game.ticks, year:game.year, month:game.month,
         tax:game.tax, funding:game.funding, bonds:game.bonds,
         peakPop:game.peakPop, rating:game.rating,
         season:game.season, weather:game.weather, history:game.history,
         demand:game.demand, parks:game.parks, disastersOn:game.disastersOn },
  };
}
function deserialize(s){
  if(!s || s.v !== 2) throw new Error("存档格式不对");
  genTerrain(s.seed);
  map.type.set(b64ToU8(s.type));
  map.density.set(b64ToU8(s.density));
  map.variant.set(b64ToU8(s.variant));
  map.park.set(b64ToU8(s.park));
  map.onFire.set(b64ToU8(s.onFire));
  if(s.roadTier) map.roadTier.set(b64ToU8(s.roadTier));
  if(s.subway) map.subway.set(b64ToU8(s.subway));
  if(s.age) new Uint8Array(map.age.buffer).set(b64ToU8(s.age));
  const rad = b64ToU8(s.rad);
  for(let i=0;i<N;i++) map.radiation[i] = rad[i]/255;

  map.anchor.fill(-1); map.bld.fill(0);
  game.buildings = [];
  for(const [x,y,b] of s.blds){
    const d = BLD[b], a = idx(x,y);
    for(let dy=0;dy<d.h;dy++) for(let dx=0;dx<d.w;dx++){
      const j = idx(x+dx,y+dy);
      map.type[j] = T.BLD; map.bld[j] = b+1; map.anchor[j] = a;
    }
    game.buildings.push({ i:a, x, y, b });
  }
  Object.assign(game, s.g);
  game.demand  = Object.assign({R:0,C:0,I:0}, s.g.demand);
  // 兼容旧存档：以前 tax 是个数字，没有 funding / bonds
  game.tax     = typeof s.g.tax === "number" ? { R:s.g.tax, C:s.g.tax, I:s.g.tax }
                                             : Object.assign({R:7,C:7,I:7}, s.g.tax);
  game.funding = Object.assign({police:1,fire:1,school:1,road:1}, s.g.funding);
  game.bonds   = Array.isArray(s.g.bonds) ? s.g.bonds : [];
  game.peakPop = s.g.peakPop || 0;
  game.rating  = s.g.rating === undefined ? 50 : s.g.rating;
  game.season  = s.g.season === undefined ? seasonOf(game.month) : s.g.season;
  game.weather = s.g.weather || "clear";
  const emptyH = { t:[],R:[],C:[],I:[],money:[],income:[],expense:[],rating:[],crime:[],pol:[],traffic:[],edu:[] };
  game.history = Object.assign(emptyH, s.g.history || {});
  SE = game.season; spriteCache.clear();
  game.tornado = null;
  computeScenic();
  updateRoadDist(); updatePower(); updateWater(); updateCoverage();
  updateTransit(); updateTraffic(); updatePollution(); updateCrime(); updateLandValue();
  const dt = document.getElementById("disToggle");
  dt.textContent = "灾难 " + (game.disastersOn ? "开" : "关");
  dt.classList.toggle("on", game.disastersOn);
  buildSpeeds(); syncBudget(); updateHUD(); drawMinimap();
}
function saveGame(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(serialize()));
    log("已存档到浏览器", "");
  } catch(e){
    log("浏览器存档失败，请用「导出」保存到文件", "warn");
  }
}
function loadGame(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw){ log("还没有存档", "warn"); return; }
    deserialize(JSON.parse(raw));
    log("存档已读取", "");
  } catch(e){ log("读档失败：" + e.message, "bad"); }
}
function exportGame(){
  const blob = new Blob([JSON.stringify(serialize())], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `pixelcity-${game.year}.${game.month}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  log("已导出存档文件", "");
}

/* =======================================================================
   13. 输入
   ======================================================================= */
/* 指针事件统一鼠标与触摸：
   桌面 —— 左键绘制、右键/中键拖动平移、滚轮缩放。
   触摸 —— 单指绘制、双指平移+捏合缩放；也可以打开「移动」模式让单指改为平移。
   两套走同一条代码路径，避免 mouse/touch 双实现互相打架。 */
let dragging = false, panning = false, panStart = null, lastPaint = -1;
let panMode = false;                       // 移动端的单指平移开关
const pointers = new Map();                // pointerId -> {x,y}
let pinch = null;                          // {dist, cx, cy, camX, camY, z}

const localXY = e => {
  const r = cv.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
};
function midOf(){
  const pts = [...pointers.values()];
  return [(pts[0].x+pts[1].x)/2, (pts[0].y+pts[1].y)/2];
}
function distOf(){
  const pts = [...pointers.values()];
  return Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
}
function beginPinch(){
  dragging = false; panning = false;
  const [mx,my] = midOf();
  pinch = { dist: Math.max(1, distOf()), mx, my, camX: cam.x, camY: cam.y, z: cam.z };
}

wrap.addEventListener("contextmenu", e => e.preventDefault());

wrap.addEventListener("pointerdown", e => {
  if(e.target !== cv) return;            // 点在浮层控件上，别当成操作地图
  if(e.pointerType !== "mouse") e.preventDefault();
  try { wrap.setPointerCapture(e.pointerId); } catch(_){}
  const [sx,sy] = localXY(e);
  pointers.set(e.pointerId, { x:sx, y:sy });

  if(pointers.size === 2){ beginPinch(); return; }
  if(pointers.size > 2) return;

  // 右键 / 中键 / 平移模式 -> 拖动地图
  if(e.button === 2 || e.button === 1 || (panMode && e.pointerType !== "mouse")){
    panning = true; panStart = { sx, sy, cx: cam.x, cy: cam.y };
    return;
  }
  const [tx,ty] = screenToTile(sx,sy);
  hoverX = tx; hoverY = ty;
  if(currentTool === "query"){ showQuery(tx,ty); return; }
  dragging = true; lastPaint = -1;
  paint(tx,ty);
});

wrap.addEventListener("pointermove", e => {
  const [sx,sy] = localXY(e);
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:sx, y:sy });

  // 双指：捏合缩放 + 同时平移
  if(pointers.size === 2 && pinch){
    e.preventDefault();
    const d = Math.max(1, distOf());
    const [mx,my] = midOf();
    const vw = wrap.clientWidth, vh = wrap.clientHeight;
    // 以捏合起点在世界中的位置为锚，缩放后把它拉回当前手指中点
    const ax = (pinch.mx - vw/2)/pinch.z + pinch.camX;
    const ay = (pinch.my - vh/2)/pinch.z + pinch.camY;
    cam.z = clamp(pinch.z * (d / pinch.dist), ZOOM_MIN, ZOOM_MAX);
    cam.x = ax - (mx - vw/2)/cam.z;
    cam.y = ay - (my - vh/2)/cam.z;
    clampCam();
    return;
  }

  if(panning && panStart){
    cam.x = panStart.cx - (sx - panStart.sx)/cam.z;
    cam.y = panStart.cy - (sy - panStart.sy)/cam.z;
    clampCam(); return;
  }
  const [tx,ty] = screenToTile(sx,sy);
  hoverX = tx; hoverY = ty;
  if(dragging) paint(tx,ty);
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinch = null;
  if(pointers.size === 0){
    dragging = false; panning = false; panStart = null;
    if(e.pointerType !== "mouse") hoverX = -1;   // 触摸抬起后不该留个幽灵光标
  }
}
wrap.addEventListener("pointerup", endPointer);
wrap.addEventListener("pointercancel", endPointer);
wrap.addEventListener("pointerleave", e => { if(e.pointerType === "mouse") hoverX = -1; });
window.addEventListener("pointerup", e => { if(!wrap.contains(e.target)) endPointer(e); });

wrap.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const bx = (sx - wrap.clientWidth/2)/cam.z + cam.x;
  const by = (sy - wrap.clientHeight/2)/cam.z + cam.y;
  cam.z = clamp(cam.z * (e.deltaY < 0 ? 1.15 : 1/1.15), ZOOM_MIN, ZOOM_MAX);
  cam.x = bx - (sx - wrap.clientWidth/2)/cam.z;
  cam.y = by - (sy - wrap.clientHeight/2)/cam.z;
  clampCam();
}, { passive:false });

function clampCam(){
  const halfW = wrap.clientWidth/2/cam.z, halfH = wrap.clientHeight/2/cam.z;
  const mw = W*TS, mh = H*TS;
  cam.x = mw <= halfW*2 ? mw/2 : clamp(cam.x, halfW, mw-halfW);
  cam.y = mh <= halfH*2 ? mh/2 : clamp(cam.y, halfH, mh-halfH);
}

window.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if(e.code === "Space"){
    e.preventDefault();
    game.speed = game.speed === 0 ? 1 : 0;
    buildSpeeds(); return;
  }
  const t = TOOLS.find(t => t.key === e.key);
  if(t) selectTool(t.id);
  const pan = 40/cam.z;
  if(e.key === "ArrowUp")    cam.y -= pan;
  if(e.key === "ArrowDown")  cam.y += pan;
  if(e.key === "ArrowLeft")  cam.x -= pan;
  if(e.key === "ArrowRight") cam.x += pan;
  clampCam();
});

function mmJump(e){
  const r = mm.getBoundingClientRect();
  cam.x = (e.clientX - r.left)/r.width  * W * TS;
  cam.y = (e.clientY - r.top) /r.height * H * TS;
  clampCam(); e.stopPropagation(); e.preventDefault();
}
mm.addEventListener("pointerdown", mmJump);
mm.addEventListener("pointermove", e => { if(e.buttons || e.pointerType !== "mouse") mmJump(e); });

// ---- 触摸辅助 ----
function zoomBy(f){
  const vw = wrap.clientWidth, vh = wrap.clientHeight;
  const ax = cam.x, ay = cam.y;          // 以屏幕中心为锚
  cam.z = clamp(cam.z * f, ZOOM_MIN, ZOOM_MAX);
  cam.x = ax; cam.y = ay;
  clampCam();
}
document.getElementById("btnPan").onclick = e => {
  panMode = !panMode;
  e.currentTarget.classList.toggle("on", panMode);
  sfx.ui();
};
document.getElementById("btnZoomIn").onclick  = () => { zoomBy(1.35); sfx.ui(); };
document.getElementById("btnZoomOut").onclick = () => { zoomBy(1/1.35); sfx.ui(); };
document.getElementById("btnSec").onclick = e => {
  document.body.classList.toggle("showsec");
  e.currentTarget.classList.toggle("on", document.body.classList.contains("showsec"));
};
// 选了建造类工具就自动退出平移模式，免得点半天没反应
const _selectTool = selectTool;
selectTool = function(id){
  _selectTool(id);
  if(panMode && id !== "query"){
    panMode = false;
    const b2 = document.getElementById("btnPan");
    if(b2) b2.classList.remove("on");
  }
};
document.getElementById("btnSound").onclick = e => {
  audio.on = !audio.on;
  e.target.textContent = "♪ " + (audio.on ? "开" : "关");
  e.target.classList.toggle("on", audio.on);
  if(audio.on){ initAudio(); sfx.ui(); }
  updateAudioMix();
};
document.getElementById("vol").addEventListener("input", e => {
  audio.vol = +e.target.value / 100;
  updateAudioMix();
});
// 浏览器要求音频必须由用户操作触发
window.addEventListener("pointerdown", () => { if(audio.on) initAudio(); }, { once:true });

document.getElementById("btnSave").onclick   = saveGame;
document.getElementById("btnLoad").onclick   = loadGame;
document.getElementById("btnExport").onclick = exportGame;
document.getElementById("btnImport").onclick = () => document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try { deserialize(JSON.parse(fr.result)); log("存档已导入", ""); }
    catch(err){ log("导入失败：" + err.message, "bad"); }
  };
  fr.readAsText(f);
  e.target.value = "";
};
document.getElementById("btnNew").onclick = () => {
  if(!confirm("重新生成地图？当前进度会丢失（可先存档）。")) return;
  newGame();
};

/* =======================================================================
   14. 主循环
   ======================================================================= */
let acc = 0, last = performance.now(), mmAcc = 0;
const TICK_MS = 500;
function frame(now){
  const dt = Math.min(now - last, 200);
  last = now;
  if(game.speed > 0){
    acc += dt * game.speed;
    let guard = 0;
    while(acc >= TICK_MS && guard++ < 12){ acc -= TICK_MS; tick(); }
  }
  tickFrac = game.speed > 0 ? Math.min(acc / TICK_MS, 1) : 0;
  waterFrame = Math.floor(now/380) % 3;
  fireFrame  = Math.floor(now/110) % 4;
  updateAgents(dt/1000);
  draw();
  mmAcc += dt;
  if(mmAcc > 400){ mmAcc = 0; drawMinimap(); updateHUD(); updateAudioMix(); }
  requestAnimationFrame(frame);
}

function newGame(){
  genTerrain((Math.random()*1e9)|0);
  SE = 1; spriteCache.clear();
  Object.assign(game, {
    money: 25000, ticks: 0, year: 1900, month: 1, speed: 1,
  tax: { R:7, C:7, I:7 },                           // 三类分区分开计税
  funding: { police:1, fire:1, school:1, road:1 },  // 各部门拨款比例 0~1.5
  bonds: [], debtPay: 0,                            // 市政债
    pop:{R:0,C:0,I:0}, demand:{R:.55,C:.2,I:.35},
    lastIncome:0, lastExpense:0, powerLoad:0, powerCap:0, waterLoad:0, waterCap:0,
    avgCrime:0, avgTraffic:0, avgPol:0, avgEdu:0, fires:0,
    landmarks:{}, peakPop:0, rating:50, transitRiders:0, metroStations:0, metroLines:0,
    season:1, weather:"clear", wIntensity:0, wTimer:0, unlockSeen:{},
    history:{ t:[],R:[],C:[],I:[],money:[],income:[],expense:[],rating:[],crime:[],pol:[],traffic:[],edu:[] },
  });
  cam.x = W*TS/2; cam.y = H*TS/2; cam.z = IS_MOBILE ? 0.55 : IS_TABLET ? 0.8 : 1;
  game.tax = { R:7, C:7, I:7 };
  game.funding = { police:1, fire:1, school:1, road:1 };
  game.bonds = []; game.debtPay = 0;
  buildSpeeds(); syncBudget();
  updateRoadDist(); updateLandValue(); updatePollution();
  updateHUD(); drawMinimap();
  log("市长，欢迎上任。先修路通电，划分区，再补上水厂和消防。", "");
  if(COARSE) log("单指绘制，双指平移缩放；也可以点右下「移动」用单指拖地图", "");
}

function start(){
  buildToolbar(); buildRCI(); buildSpeeds(); buildSelects(); buildBudget(); buildGoals(); buildCharts();
  resize();
  newGame();
  requestAnimationFrame(frame);
}
start();
