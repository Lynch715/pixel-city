<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>像素模拟城市 v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #14161c; color: #d8dde8;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", monospace;
    font-size: 12px; overflow: hidden;
    display: flex; flex-direction: column;
    user-select: none; -webkit-user-select: none;
  }

  #topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 7px 12px; background: #1c1f28;
    border-bottom: 2px solid #0c0e12; flex-shrink: 0; flex-wrap: wrap;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; min-width: 58px; }
  .stat .k { font-size: 9px; color: #6c7689; letter-spacing: .06em; }
  .stat .v { font-size: 15px; font-weight: 700; color: #e8edf7; font-variant-numeric: tabular-nums; }
  .v.neg { color: #e2685e; }
  .v.warn { color: #d9a441; }

  #rci { display: flex; align-items: flex-end; gap: 5px; height: 42px; }
  .rci-col { width: 16px; height: 42px; position: relative; }
  .rci-track { position: absolute; left: 0; right: 0; top: 5px; bottom: 12px; }
  .rci-mid { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #39404f; }
  .rci-bar { position: absolute; left: 2px; right: 2px; }
  .rci-lab { position: absolute; bottom: 0; left: 3px; font-size: 9px; color: #6c7689; }

  .sbtn {
    background: #262b36; border: 1px solid #333a48; color: #98a2b6;
    padding: 5px 9px; cursor: pointer; font-family: inherit; font-size: 11px; border-radius: 3px;
  }
  .sbtn:hover { background: #2e3441; }
  .sbtn.on { background: #3f7d4e; border-color: #58a568; color: #eaf7ec; }
  .sbtn.danger.on { background: #8a3d36; border-color: #c9584a; color: #ffe9e6; }
  .speed-btns, .btn-row { display: flex; gap: 4px; }

  input[type=range] { width: 84px; accent-color: #58a568; }
  select {
    background: #262b36; border: 1px solid #333a48; color: #b6bfd0;
    font-family: inherit; font-size: 11px; padding: 4px 6px; border-radius: 3px;
  }

  #main { flex: 1; display: flex; min-height: 0; }
  #toolbar {
    width: 140px; flex-shrink: 0; background: #1c1f28;
    border-right: 2px solid #0c0e12; padding: 8px; overflow-y: auto;
  }
  #toolbar::-webkit-scrollbar { width: 6px; }
  #toolbar::-webkit-scrollbar-thumb { background: #333a48; border-radius: 3px; }
  .tgroup { font-size: 9px; color: #5b6478; letter-spacing: .1em; margin: 10px 0 5px 2px; }
  .tgroup:first-child { margin-top: 0; }
  .tool {
    display: flex; align-items: center; gap: 6px; width: 100%;
    background: #262b36; border: 1px solid #333a48; border-radius: 3px;
    color: #b6bfd0; padding: 5px 6px; margin-bottom: 3px; cursor: pointer;
    font-family: inherit; font-size: 11px; text-align: left;
  }
  .tool:hover { background: #2e3441; }
  .tool.on { background: #35507a; border-color: #5b86c9; color: #eef4ff; }
  .tool .sw { width: 13px; height: 13px; flex-shrink: 0; border-radius: 2px; }
  .tool .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool .cost { margin-left: auto; font-size: 9px; color: #7d879b; }
  .tool.on .cost { color: #c3d6f5; }
  .tool.locked { opacity: .45; }
  .tool.locked .cost { color: #7d879b; }

  #canvasWrap { flex: 1; position: relative; overflow: hidden; background: #0e1015; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }

  #log { position: absolute; left: 10px; bottom: 10px; width: 268px;
         display: flex; flex-direction: column-reverse; gap: 3px; pointer-events: none; }
  .msg { background: rgba(18,20,26,.9); border-left: 3px solid #58a568;
         padding: 4px 8px; font-size: 11px; color: #cdd5e3; border-radius: 0 3px 3px 0;
         animation: fade 9s forwards; }
  .msg.warn { border-left-color: #d9a441; }
  .msg.bad  { border-left-color: #e2685e; }
  @keyframes fade { 0%,82% { opacity: 1 } 100% { opacity: 0 } }

  #query { position: absolute; right: 10px; top: 10px; width: 188px;
           background: rgba(18,20,26,.95); border: 1px solid #333a48; border-radius: 4px;
           padding: 8px 10px; display: none; }
  #query h4 { font-size: 12px; color: #e8edf7; margin-bottom: 6px; }
  #query .row { display: flex; justify-content: space-between; font-size: 11px; color: #98a2b6; padding: 1px 0; }
  #query .row span:last-child { color: #d8dde8; }

  #legend { pointer-events: none; position: absolute; right: 10px; bottom: 10px;
            background: rgba(18,20,26,.9); border: 1px solid #333a48; border-radius: 4px;
            padding: 6px 9px; display: none; }
  #legend .t { font-size: 10px; color: #98a2b6; margin-bottom: 4px; }
  #legend .sc { display: flex; height: 8px; width: 130px; border-radius: 2px; overflow: hidden; }
  #legend .sc i { flex: 1; }
  #legend .lb { display: flex; justify-content: space-between; font-size: 9px; color: #6c7689; margin-top: 2px; }

  #hint { position: absolute; left: 10px; bottom: 150px; font-size: 10px;
          color: #4d5566; line-height: 1.6; pointer-events: none; }
  #budget {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 330px; background: rgba(20,23,30,.97); border: 1px solid #3a4250;
    border-radius: 6px; padding: 14px 16px; display: none; z-index: 20;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  #budget h3 { font-size: 14px; color: #e8edf7; margin-bottom: 10px; }
  .bsec { font-size: 9px; color: #5b6478; letter-spacing: .1em; margin: 10px 0 6px; }
  .brow { display: flex; justify-content: space-between; align-items: center;
          font-size: 11px; color: #98a2b6; padding: 3px 0; gap: 8px; }
  .brow span:last-child { color: #d8dde8; font-variant-numeric: tabular-nums; }
  .brow.strong span { color: #e8edf7; font-weight: 700; font-size: 12px; }
  .brow input[type=range] { flex: 1; width: auto; }
  .brow .val { min-width: 38px; text-align: right; }
  .brow .nm { min-width: 52px; }
  #goals {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 340px; max-height: 82%; overflow-y: auto;
    background: rgba(20,23,30,.97); border: 1px solid #3a4250;
    border-radius: 6px; padding: 14px 16px; display: none; z-index: 20;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  #goals h3 { font-size: 14px; color: #e8edf7; margin-bottom: 10px; }
  .rbar { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #98a2b6; padding: 2px 0; }
  .rbar .nm { min-width: 56px; }
  .rbar .track { flex: 1; height: 7px; background: #2a303c; border-radius: 4px; overflow: hidden; }
  .rbar .fill { height: 100%; border-radius: 4px; }
  .rbar .val { min-width: 32px; text-align: right; color: #d8dde8; }
  .ms { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 11px;
        border-bottom: 1px solid #262c37; }
  .ms .dot { width: 9px; height: 9px; border-radius: 50%; background: #3a4250; flex-shrink: 0; }
  .ms.done .dot { background: #5fd08a; }
  .ms .t { color: #98a2b6; }
  .ms.done .t { color: #e8edf7; }
  .ms .perk { margin-left: auto; color: #6c7689; font-size: 10px; text-align: right; }
  #charts {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 648px; max-height: 88%; overflow-y: auto;
    background: rgba(20,23,30,.97); border: 1px solid #3a4250;
    border-radius: 6px; padding: 14px 16px; display: none; z-index: 20;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  #charts h3 { font-size: 14px; color: #e8edf7; margin-bottom: 10px; }
  .cwrap { margin-bottom: 12px; }
  .ctitle { font-size: 10px; color: #6c7689; letter-spacing: .08em; margin-bottom: 4px; }
  #charts canvas { display: block; width: 100%; background: #171a21; border-radius: 4px; }
  .clegend { display: flex; gap: 10px; font-size: 10px; color: #98a2b6; margin-top: 4px; align-items: center; }
  .clegend i { width: 9px; height: 3px; border-radius: 2px; display: inline-block; margin-right: 3px; }
  /* ---------- 触摸辅助按钮 ---------- */
  #touchbar { position: absolute; right: 10px; bottom: 10px; display: none; gap: 6px; z-index: 12; }
  body.touch #touchbar { display: flex; }
  .tbtn {
    background: rgba(28,31,40,.92); border: 1px solid #3a4250; color: #b6bfd0;
    border-radius: 6px; font-family: inherit; font-size: 13px; padding: 0 12px;
    min-width: 46px; height: 46px; cursor: pointer; touch-action: manipulation;
  }
  .tbtn.on { background: #35507a; border-color: #5b86c9; color: #eef4ff; }

  /* ---------- 竖屏引导 ---------- */
  #rotate {
    position: fixed; inset: 0; background: #14161c; z-index: 100;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: #98a2b6; text-align: center; padding: 24px;
  }
  #rotate .ricon { font-size: 54px; color: #5b86c9; transform: rotate(90deg); }
  #rotate .rsub { font-size: 11px; color: #5b6478; }
  @media (orientation: portrait) {
    body.touch #rotate { display: flex; }
  }

  /* ---------- 横屏手机紧凑布局 ---------- */
  body.touch #canvasWrap { touch-action: none; }
  body.touch canvas { cursor: default; }
  body.touch .sbtn { min-height: 34px; padding: 6px 10px; }
  body.touch input[type=range] { height: 28px; }
  body.touch .tool { padding: 8px 6px; margin-bottom: 5px; }

  @media (max-height: 560px) {
    #legend { bottom: auto; top: 8px; right: 184px; }
    #topbar { padding: 4px 8px; gap: 9px; }
    .stat { min-width: 44px; gap: 0; }
    .stat .k { font-size: 8px; }
    .stat .v { font-size: 12px; }
    #rci { height: 30px; gap: 4px; }
    .rci-col { width: 13px; height: 30px; }
    .rci-track { top: 3px; bottom: 9px; }
    .rci-lab { font-size: 8px; }
    .sbtn { font-size: 10px; padding: 5px 7px; }
    #toolbar { width: 104px; padding: 5px; }
    .tool { font-size: 10px; gap: 4px; padding: 6px 4px; }
    .tool .sw { width: 11px; height: 11px; }
    .tool .cost { font-size: 8px; }
    .tgroup { font-size: 8px; margin: 6px 0 3px 2px; }
    #minimap { width: 92px; height: 92px; }
    #mmLabel { top: 106px; }
    #hint { display: none; }
    #log { width: 210px; bottom: 62px; }
    .msg { font-size: 10px; padding: 3px 6px; }
    /* 面板改为贴合视口，内部滚动 */
    #budget, #goals, #charts {
      max-height: calc(100% - 16px); top: 8px; transform: translate(-50%, 0);
      overflow-y: auto; padding: 10px 12px;
    }
    #budget { width: 300px; }
    #goals  { width: 310px; }
    #charts { width: min(96vw, 620px); }
    #charts canvas { height: 96px; }
    #query { top: 8px; width: 168px; font-size: 10px; }
    #query .row { font-size: 10px; }
  }
  /* 次要指标在窄屏上收起来，靠「详情」按钮展开 */
  @media (max-width: 900px) {
    body.compact .sec { display: none !important; }
    body.compact.showsec .stat.sec { display: flex !important; }
    body.compact.showsec .btn-row.sec { display: flex !important; }
    body.compact.showsec div.sec { display: flex !important; }
    body.compact #topbar { flex-wrap: wrap; row-gap: 5px; }
  }
  @media (min-width: 901px) { #btnSec { display: none; } }

  #minimap { position: absolute; left: 10px; top: 10px; border: 1px solid #333a48;
             image-rendering: pixelated; background: #0e1015; cursor: pointer; }
  #mmLabel { pointer-events: none; position: absolute; left: 10px; top: 142px; font-size: 9px; color: #6c7689; pointer-events: none; }
</style>
</head>
<body>

<div id="topbar">
  <div class="stat"><span class="k">资金</span><span class="v" id="sMoney">$0</span></div>
  <div class="stat"><span class="k">人口</span><span class="v" id="sPop">0</span></div>
  <div class="stat sec"><span class="k">日期</span><span class="v" id="sDate">1900.1</span></div>
  <div class="stat sec"><span class="k">时刻</span><span class="v" id="sClock">--:--</span></div>
  <div class="stat sec"><span class="k">天气</span><span class="v" id="sWeather">夏 · 晴</span></div>
  <div class="stat sec"><span class="k">收支/月</span><span class="v" id="sFlow">$0</span></div>
  <div class="stat sec"><span class="k">电力</span><span class="v" id="sPower">0/0</span></div>
  <div class="stat sec"><span class="k">供水</span><span class="v" id="sWater">0/0</span></div>
  <div class="stat sec"><span class="k">地铁客流</span><span class="v" id="sMetro">0</span></div>
  <div id="rci"></div>
  <div class="stat"><span class="k">市长评分</span><span class="v" id="sRating">50</span></div>
  <button class="sbtn" id="btnSec">详情</button>
  <button class="sbtn" id="btnBudget">预算 ▸</button>
  <button class="sbtn" id="btnGoals">目标 ▸</button>
  <button class="sbtn" id="btnCharts">图表 ▸</button>
  <div class="sec" style="display:flex;align-items:center;gap:5px">
    <button class="sbtn on" id="btnSound">♪ 开</button>
    <input type="range" id="vol" min="0" max="100" value="50" style="width:64px">
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <span style="font-size:9px;color:#6c7689">数据视图</span>
    <select id="overlay"></select>
  </div>
  <div class="speed-btns" id="speeds"></div>
  <div class="btn-row sec">
    <button class="sbtn danger on" id="disToggle" title="随机灾难开关">灾难 开</button>
    <select id="disMenu"><option value="">降灾…</option></select>
  </div>
  <div class="btn-row sec">
    <button class="sbtn" id="btnSave">存档</button>
    <button class="sbtn" id="btnLoad">读档</button>
    <button class="sbtn" id="btnExport">导出</button>
    <button class="sbtn" id="btnImport">导入</button>
    <button class="sbtn" id="btnNew">新地图</button>
  </div>
  <input type="file" id="fileIn" accept=".json" style="display:none">
</div>

<div id="rotate"><div class="ricon">▭</div><div>请横屏游玩</div><div class="rsub">这是一张 64×64 的城市地图，横屏才放得下</div></div>

<div id="main">
  <div id="toolbar"></div>
  <div id="canvasWrap">
    <canvas id="cv"></canvas>
    <canvas id="minimap" width="128" height="128"></canvas>
    <div id="mmLabel">小地图</div>
    <div id="query"></div>
    <div id="legend"><div class="t"></div><div class="sc"></div><div class="lb"><span>低</span><span>高</span></div></div>
    <div id="budget">
      <h3>市政预算</h3>
      <div class="bsec">分区税率</div>
      <div id="taxRows"></div>
      <div class="bsec">部门拨款</div>
      <div id="fundRows"></div>
      <div class="bsec">收支</div>
      <div class="brow"><span>月收入</span><span id="bIncome">$0</span></div>
      <div class="brow"><span>月支出</span><span id="bExpense">$0</span></div>
      <div class="brow"><span>其中偿债与利息</span><span id="bDebt">$0</span></div>
      <div class="brow strong"><span>净额</span><span id="bNet">$0</span></div>
      <button class="sbtn" id="btnBond" style="width:100%;margin-top:8px">发行市政债（+$12,000，月还 $138 × 120）</button>
      <div class="brow" style="margin-top:4px"><span>未偿债券</span><span id="bBonds">0 / 4</span></div>
      <button class="sbtn" id="btnBudgetClose" style="width:100%;margin-top:8px">关闭</button>
    </div>
    <div id="goals">
      <h3>城市目标</h3>
      <div class="brow strong"><span>市长评分</span><span id="gRating">50 / 100</span></div>
      <div id="ratingBars"></div>
      <div class="bsec">里程碑</div>
      <div id="milestones"></div>
      <button class="sbtn" id="btnGoalsClose" style="width:100%;margin-top:10px">关闭</button>
    </div>
    <div id="charts">
      <h3>城市历史</h3>
      <div class="cwrap"><div class="ctitle">人口构成</div><canvas id="chPop" width="600" height="150"></canvas>
        <div class="clegend"><i style="background:#5fbf6a"></i>住宅<i style="background:#5b9bd8"></i>商业<i style="background:#d8b64a"></i>工业</div></div>
      <div class="cwrap"><div class="ctitle">财政</div><canvas id="chMoney" width="600" height="150"></canvas>
        <div class="clegend"><i style="background:#7ed88a"></i>月收入<i style="background:#e2685e"></i>月支出<i style="background:#e8edf7"></i>资金</div></div>
      <div class="cwrap"><div class="ctitle">城市指标</div><canvas id="chStat" width="600" height="150"></canvas>
        <div class="clegend"><i style="background:#f2c94c"></i>评分<i style="background:#e24a8a"></i>犯罪<i style="background:#8a6a3a"></i>污染<i style="background:#e2685e"></i>拥堵<i style="background:#c98ad8"></i>教育</div></div>
      <button class="sbtn" id="btnChartsClose" style="width:100%;margin-top:8px">关闭</button>
    </div>
    <div id="touchbar">
      <button class="tbtn" id="btnPan" title="单指平移地图">✥ 移动</button>
      <button class="tbtn" id="btnZoomIn">＋</button>
      <button class="tbtn" id="btnZoomOut">－</button>
    </div>
    <div id="log"></div>
    <div id="hint">左键拖动绘制 · 右键拖动平移 · 滚轮缩放<br>数字键切换工具 · 空格暂停 · 点小地图跳转</div>
  </div>
</div>

<script>
"use strict";
/* =======================================================================
   0. 常量与建筑定义
   ======================================================================= */
const W = 64, H = 64, N = W * H;
const TS = 32;                     // v3 起改为 32px：16px 下每栋楼只有 256 个像素，画不出细节

/* 设备判定。粗指针 = 触摸设备；短边 < 900 视为手机/小平板，走紧凑布局。 */
const COARSE   = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
const SHORTSIDE= Math.min(window.screen.width, window.screen.height);
const IS_MOBILE= COARSE && SHORTSIDE < 900;
const IS_TABLET= COARSE && SHORTSIDE >= 900;
const ZOOM_MIN = IS_MOBILE ? 0.28 : 0.3, ZOOM_MAX = 4;
if(COARSE) document.body.classList.add("touch");
if(IS_MOBILE) document.body.classList.add("compact");

const T = { LAND:0, WATER:1, TREE:2, ROAD:3, WIRE:4, R:5, C:6, I:7, BLD:8, RUBBLE:9 };
const isZone = t => t >= T.R && t <= T.I;

const CAP = {
  [T.R]: [0, 8, 26, 68],
  [T.C]: [0, 5, 17, 46],
  [T.I]: [0, 7, 21, 54],
};

const AVE_MULT = 2.5;             // 大道容量倍数
const STATION_R = 5;              // 地铁站接驳半径（步行可达）
const TRANSIT_SHARE = 0.72;       // 接驳成功时从路网转移走的通勤比例

/* 建筑定义表。w/h 为占地格数，power/water 为产能，pUse/wUse 为消耗，
   radius 为服务覆盖半径。所有建筑都需要通电通水通路才能正常运转。 */
const BLD = [
  { key:"coal",   name:"燃煤电厂",   cat:"电力", w:3,h:3, cost:2400,  up:70,  power:1200, pUse:0, wUse:30, pollute:.26, sw:"#c9584a" },
  { key:"gas",    name:"燃气电厂",   cat:"电力", w:3,h:3, cost:5200,  up:130, power:2400, pUse:0, wUse:30, pollute:.09, sw:"#e0a24a" },
  { key:"solar",  name:"太阳能电站", cat:"电力", w:4,h:4, cost:8200,  up:22,  power:1900, pUse:0, wUse:0,  pollute:0,   sw:"#4a8fd8" },
  { key:"nuke",   name:"核电站",     cat:"电力", w:4,h:4, cost:18000, up:330, power:6500, pUse:0, wUse:90, pollute:0,   melt:true, sw:"#7ad86a" },
  { key:"pump",   name:"抽水站",     cat:"供水", w:2,h:2, cost:700,   up:16,  water:1000, pUse:35, needShore:true, sw:"#3fa8cc" },
  { key:"tower",  name:"水塔",       cat:"供水", w:2,h:2, cost:1500,  up:14,  water:420,  pUse:15, sw:"#8ad8e8" },

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---- 地形 ---- */
function valueNoise(seed, scale){
  const rnd = mulberry32(seed);
  const gw = Math.ceil(W/scale)+2, gh = Math.ceil(H/scale)+2;
  const g = new Float32Array(gw*gh);
  for(let i=0;i<g.length;i++) g[i] = rnd();
  return (x,y) => {
    const fx = x/scale, fy = y/scale;
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const tx = fx-x0, ty = fy-y0;
    const sx = tx*tx*(3-2*tx), sy = ty*ty*(3-2*ty);
    const a = g[y0*gw+x0],     b = g[y0*gw+x0+1];
    const c = g[(y0+1)*gw+x0], d = g[(y0+1)*gw+x0+1];
    return lerp(lerp(a,b,sx), lerp(c,d,sx), sy);
  };
}

function genTerrain(seed){
  game.seed = seed;
  const n1 = valueNoise(seed,     14);
  const n2 = valueNoise(seed+77,   6);
  const n3 = valueNoise(seed+911,  3);
  const rnd = mulberry32(seed+5);

  for(const k of ["type","density","bld","age","park","onFire","roadTier","subway"]) map[k].fill(0);
  for(const k of ["pollution","landval","traffic","crime","edu","fireCov","polCov","radiation"]) map[k].fill(0);
  map.anchor.fill(-1);
  game.buildings.length = 0;
  game.parks = 0;
  for(const k of Object.keys(agents)) agents[k].length = 0;
  game.smokeSrc = [];
  game.tornado = null;

  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const i = idx(x,y);
    map.variant[i] = (rnd()*256)|0;
    const e = n1(x,y)*.62 + n2(x,y)*.28 + n3(x,y)*.10;
    if(e < .355)                      map.type[i] = T.WATER;
    else if(e > .60 && n3(x,y) > .42) map.type[i] = T.TREE;
    else                              map.type[i] = T.LAND;
  }
  // 去掉孤立水坑
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const i = idx(x,y);
    if(map.type[i] !== T.WATER) continue;
    let n = 0;
    for(const [dx,dy] of DIR4) if(inb(x+dx,y+dy) && map.type[idx(x+dx,y+dy)]===T.WATER) n++;
    if(n === 0) map.type[i] = T.LAND;
  }
  computeScenic();
}

function computeScenic(){
  const dist = new Float32Array(N).fill(99);
  const q = [];
  for(let i=0;i<N;i++){
    const t = map.type[i];
    if(t===T.WATER || t===T.TREE || map.park[i]){ dist[i]=0; q.push(i); }
  }
  for(let h=0; h<q.length; h++){
    const i = q[h];
    if(dist[i] >= 6) continue;
    const x=i%W, y=(i/W)|0;
    for(const [dx,dy] of DIR4){
      const nx=x+dx, ny=y+dy;
      if(!inb(nx,ny)) continue;
      const j = idx(nx,ny);
      if(dist[j] > dist[i]+1){ dist[j] = dist[i]+1; q.push(j); }
    }
  }
  for(let i=0;i<N;i++) map.scenic[i] = clamp(1 - dist[i]/7, 0, 1) * .45;
}

/* ---- 绘制原语 ---- */
const spriteCache = new Map();
function sprite(key, w, h, draw){
  let s = spriteCache.get(key);
  if(s) return s;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  draw(g);
  spriteCache.set(key, c);
  return c;
}
function px(g, x, y, w, h, col){ g.fillStyle = col; g.fillRect(x, y, w, h); }
/* 带方向光的实体块 */
function box(g, x, y, w, h, base, lit, dark){
  px(g,x,y,w,h,base);
  if(lit){ px(g,x,y,w,1,lit); px(g,x,y,1,h,lit); }
  if(dark){ px(g,x,y+h-1,w,1,dark); px(g,x+w-1,y,1,h,dark); }
}
/* 统一投向右下的地面投影 */
function shad(g, x, y, w, h, off){
  const o = off===undefined ? 3 : off;
  px(g, x+o, y+o, w, h, P.shadow);
}
/* 圆盘，用来堆树冠和罐体 */
function disc(g, cx, cy, rad, col){
  for(let dy=-rad; dy<=rad; dy++){
    const w = Math.floor(Math.sqrt(Math.max(0, rad*rad - dy*dy)));
    px(g, cx-w, cy+dy, w*2+1, 1, col);
  }
}
/* 不规则色斑，比随机噪点自然 */
function blob(g, cx, cy, rad, col, r){
  for(let k=0;k<5;k++){
    const w = rad + ((r()*rad)|0), h = rad + ((r()*rad)|0);
    px(g, cx-(w>>1)+((r()*5)|0)-2, cy-(h>>1)+((r()*5)|0)-2, w, h, col);
  }
}
/* ---- 地面 ---- */
function grassSprite(v){
  return sprite("g"+v+"_"+SE, TS, TS, g => {
    const S = SEASON[SE], r = mulberry32(v*7919+13);
    px(g,0,0,TS,TS,S.grass);
    for(let k=0;k<4;k++) blob(g,(r()*TS)|0,(r()*TS)|0, 4+((r()*4)|0), r()<.5?S.grassD:S.grassL, r);
    for(let k=0;k<26;k++){
      const x=(r()*TS)|0, y=(r()*TS)|0;
      px(g,x,y,1,2, r()<.42 ? S.grassHi : S.grassDk);
    }
    if(S.snow){
      for(let k=0;k<5;k++) blob(g,(r()*TS)|0,(r()*TS)|0,3+((r()*3)|0),"#ffffff",r);
    } else {
      const nb = S.bloom ? 9 : 5;
      for(let k=0;k<nb;k++)
        px(g, 3+((r()*(TS-6))|0), 3+((r()*(TS-6))|0), 1,1,
           S.bloom && r()<.55 ? S.bloom : (r()<.5 ? S.grassHi : S.grassDk));
    }
  });
}
function waterSprite(v, frame, shore){
  return sprite("w"+v+"_"+frame+"_"+shore, TS, TS, g => {
    px(g,0,0,TS,TS,P.water);
    // 缓慢起伏的深浅带，比纯噪点更像水面
    for(let y=0;y<TS;y++){
      const t = Math.sin((y + v*2.7 + frame*3.1) * 0.38) + Math.sin((y - v*1.3) * 0.17)*0.5;
      if(t > 0.85) px(g,0,y,TS,1,P.waterL);
      else if(t < -0.95) px(g,0,y,TS,1,P.waterD);
    }
    const r = mulberry32(v*104729 + frame*31);
    for(let k=0;k<8;k++){
      const x=(r()*(TS-9))|0, y=(r()*TS)|0, w=3+((r()*6)|0);
      px(g,x,y,w,1,P.waterHi);
      if(r()<.5) px(g,x+1,y+1,w-2,1,P.waterL);
    }
    if(shore){
      const r2 = mulberry32(v*7919);
      const band = (x,y,w,h,horiz,flip) => {
        px(g,x,y,w,h,P.sand);
        // 干沙 -> 湿沙 -> 浪花，三层过渡
        if(horiz) px(g, x, flip ? y-2 : y+h, w, 2, P.sandWet);
        else      px(g, flip ? x-2 : x+w, y, 2, h, P.sandWet);
        const n = horiz ? w : h;
        for(let k=0;k<n;k++){
          if(r2()<.42) continue;
          if(horiz) px(g, x+k, flip ? y-3 : y+h+2, 1, 1, P.sandD);
          else      px(g, flip ? x-3 : x+w+2, y+k, 1, 1, P.sandD);
        }
        for(let k=0;k<n;k+=2){
          if(r2()<.5) continue;
          if(horiz) px(g, x+k, flip ? y-4 : y+h+3, 2, 1, P.waterHi);
          else      px(g, flip ? x-4 : x+w+3, y+k, 1, 2, P.waterHi);
        }
      };
      if(shore&1) band(0,0,TS,4,true,false);
      if(shore&4) band(0,TS-4,TS,4,true,true);
      if(shore&8) band(0,0,4,TS,false,false);
      if(shore&2) band(TS-4,0,4,TS,false,true);
    }
  });
}
function treeSprite(v){
  v %= 12;
  return sprite("t"+v+"_"+SE, TS, TS, g => {
    const S = SEASON[SE];
    g.drawImage(grassSprite(v%4),0,0);
    const r = mulberry32(v*15485863+3);
    const n = 1 + ((r()*2)|0);
    for(let k=0;k<n;k++){
      const cx = 8+((r()*17)|0), cy = 8+((r()*15)|0), rad = 5+((r()*3)|0);
      px(g, cx-rad+3, cy+rad-1, rad*2-2, 3, P.shadow);
      px(g, cx-1, cy+rad-2, 2, 5, P.trunkD);
      px(g, cx-1, cy+rad-2, 1, 5, P.trunk);
      if(S.snow){
        for(let m=0;m<5;m++){
          const a2 = -Math.PI/2 + (m-2)*0.5;
          for(let d2=1; d2<rad; d2++)
            px(g, cx+Math.round(Math.cos(a2)*d2), cy+Math.round(Math.sin(a2)*d2)-1, 1, 1, S.treeD);
        }
        for(let m=0;m<6;m++) px(g, cx-3+((r()*6)|0), cy-rad+((r()*3)|0), 2, 1, "#f4f8fb");
      } else {
        disc(g, cx, cy, rad, S.treeD);
        disc(g, cx-1, cy-1, rad-1, S.tree);
        disc(g, cx-2, cy-2, rad-3, S.treeL);
        for(let m=0;m<4;m++)
          px(g, cx-3+((r()*4)|0), cy-4+((r()*4)|0), 1, 1, S.treeHi);
      }
    }
  });
}

/* ---- 道路：4 格草地边 / 4 格人行道 / 16 格沥青 ---- */
const RA = 8, RB = 24, RS0 = 4, RS1 = 28;
const AA = 5, AB = 27, AS0 = 2, AS1 = 30;        // 大道：沥青更宽，人行道压窄
function roadSprite(mask, v, tier){
  if(tier) return avenueSprite(mask, v);
  return sprite("r"+mask+"_"+v+"_"+SE, TS, TS, g => {
    const r = mulberry32(mask*7717 + v*131 + 3);
    g.drawImage(grassSprite((mask+v)%4), 0, 0);

    // 人行道
    const sw = (x,y,w,h)=>px(g,x,y,w,h,P.conc);
    sw(RS0,RS0,RS1-RS0,RS1-RS0);
    if(mask&1) sw(RS0,0,RS1-RS0,RS0);
    if(mask&2) sw(RS1,RS0,TS-RS1,RS1-RS0);
    if(mask&4) sw(RS0,RS1,RS1-RS0,TS-RS1);
    if(mask&8) sw(0,RS0,RS0,RS1-RS0);

    for(let k=0;k<TS;k+=8){
      px(g,k,RS0,1,RS1-RS0,P.concD); px(g,RS0,k,RS1-RS0,1,P.concD);
    }
    for(let k=0;k<18;k++) px(g,(r()*TS)|0,(r()*TS)|0,1,1, r()<.5?P.concL:P.concD);

    // 沥青
    const seg = (x,y,w,h)=>px(g,x,y,w,h,P.asph);
    seg(RA,RA,RB-RA,RB-RA);
    if(mask&1) seg(RA,0,RB-RA,RA);
    if(mask&2) seg(RB,RA,TS-RB,RB-RA);
    if(mask&4) seg(RA,RB,RB-RA,TS-RB);
    if(mask&8) seg(0,RA,RA,RB-RA);
    // 沥青质感：补丁与细裂纹
    for(let k=0;k<5;k++){
      const x=RA+((r()*(RB-RA-5))|0), y=RA+((r()*(RB-RA-4))|0);
      px(g,x,y,3+((r()*4)|0),2+((r()*2)|0), r()<.5?P.asphPatch:P.asphD);
    }

    // 路缘：靠人行道一侧压暗，形成清晰的边界
    const curb=(x,y,w,h)=>px(g,x,y,w,h,P.curb);
    if(!(mask&1)) curb(RA,RA,RB-RA,1);
    if(!(mask&4)) curb(RA,RB-1,RB-RA,1);
    if(!(mask&8)) curb(RA,RA,1,RB-RA);
    if(!(mask&2)) curb(RB-1,RA,1,RB-RA);
    if(mask&1){ curb(RA-1,0,1,RA); curb(RB,0,1,RA); }
    if(mask&4){ curb(RA-1,RB,1,TS-RB); curb(RB,RB,1,TS-RB); }
    if(mask&8){ curb(0,RA-1,RA,1); curb(0,RB,RA,1); }
    if(mask&2){ curb(RB,RA-1,TS-RB,1); curb(RB,RB,TS-RB,1); }

    const bits = (mask&1?1:0)+(mask&2?1:0)+(mask&4?1:0)+(mask&8?1:0);
    // 中线
    if(bits<=2 && (mask&1||mask&4) && !(mask&2) && !(mask&8))
      for(let y=1;y<TS;y+=7) px(g,15,y,2,4,P.line);
    if(bits<=2 && (mask&2||mask&8) && !(mask&1) && !(mask&4))
      for(let x=1;x<TS;x+=7) px(g,x,15,4,2,P.line);
    // 路口斑马线
    if(bits>=3){
      if(mask&1) for(let x=RA+1;x<RB-2;x+=4) px(g,x,1,2,5,P.cross);
      if(mask&4) for(let x=RA+1;x<RB-2;x+=4) px(g,x,TS-6,2,5,P.cross);
      if(mask&8) for(let y=RA+1;y<RB-2;y+=4) px(g,1,y,5,2,P.cross);
      if(mask&2) for(let y=RA+1;y<RB-2;y+=4) px(g,TS-6,y,5,2,P.cross);
    }
    // 井盖
    if(v===1 && bits<=2){ disc(g,16,16,2,P.asphD); disc(g,16,16,1,P.asphL); }
    if(SEASON[SE].snow){
      // 冬天：人行道积雪、路肩残雪，车道被压出来了
      const sr = mulberry32(mask*31+v);
      for(let k=0;k<26;k++){
        const x=(sr()*TS)|0, y=(sr()*TS)|0;
        if(x>=RA && x<RB && y>=RA && y<RB && sr()<.78) continue;
        px(g,x,y,2,2, sr()<.6 ? "#eef4f8" : "#d6e2ea");
      }
      px(g,RA-1,RA-1,RB-RA+2,1,"#eef4f8"); px(g,RA-1,RB,RB-RA+2,1,"#eef4f8");
    }
    if(bits===0){ px(g,13,13,6,6,P.asphL); px(g,14,14,4,4,P.asph); }
  });
}
/* 大道：双向两车道 + 中央绿化带，容量是街道的 2.5 倍 */

      for(let k=1;k<TS;k+=6){ px(g,k,15,3,1,P.line); px(g,15,k,1,3,P.line); }

    if(bits>=3){
      if(mask&1) for(let x=AA+1;x<AB-2;x+=4) px(g,x,0,2,4,P.cross);
